<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Notes App</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main>
    <h1>My API Notes</h1>
    
    <div class="controls">
      <button id="load-btn">Load notes</button>
    </div>
    
    <p id="status"></p>

    <form id="note-form">
      <h2>Create a Note</h2>
      <div class="form-group">
        <label for="title-input">Title (max 100 characters):</label>
        <input type="text" id="title-input" maxlength="100" required>
      </div>
      <div class="form-group">
        <label for="body-input">Body:</label>
        <textarea id="body-input" rows="4" required></textarea>
      </div>
      <button type="submit" id="submit-btn">Add Note</button>
    </form>

    <ul id="notes-list"></ul>
  </main>
</body>
</html>
